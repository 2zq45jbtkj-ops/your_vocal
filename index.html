  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="manifest" id="app-manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="СЕПТ · ДЗ">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>
    /* Личная ссылка ?k=… — значок «ДЗ» на экране телефона открывает её же,
       чтобы приложение сразу знало, чьё это ДЗ. */
    (function () {
      var m = /[?&]k=([0-9a-fA-F-]{36})(?:&|$)/.exec(location.search);
      if (m) document.getElementById("app-manifest").href = "/api/manifest?k=" + m[1].toLowerCase();
    })();
  </script>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <div class="sp-logo"><canvas width="880" height="392"></canvas></div>
    <div class="sp-pill"><img src="/icons/icon-192.png" alt=""><div><b>СЕПТ · ДЗ</b><span>домашние задания</span></div></div>
    <div class="sp-bar"><i></i></div>
    <video src="/splash/logo.mp4" muted playsinline webkit-playsinline autoplay preload="auto"></video>
  </div>
  <script src="splash.js?v=20261119a"></script>
  <div id="app" aria-live="polite"></div>
  <!-- Тексты оферты / политики / «О преподавателе» — только данные, без логики.
       Обязательно до app.js: renderDoc() читает LEGAL_DOCS при первом рендере. -->
  <script src="legal.js?v=20261117x"></script>
  <script src="app.js?v=20261119d"></script>
  <script src="karaoke.js?v=20261117x"></script>
  <script src="pitch.js?v=20261117x"></script>
  <script src="bylo.js?v=20261117x"></script>
  <script src="breath-anim.js?v=20261119b"></script>
  <script>
    /* Новая версия без ручного перезапуска: значок на экране телефона держит
       страницу в памяти, поэтому при возвращении в приложение сверяем версию
       (api/version.js) и перезагружаемся, если вышла новая. Не трогаем экраны,
       где что-то записывается или печатается. */
    (function () {
      var v0 = null, BUSY = /^(bylo|admin-karaoke-edit|pitch-sing|support|feedback|quiz|cab-voice|token-entry|admin-karaoke-songs)$/;
      function check(mayReload) {
        fetch("/api/version?t=" + Date.now(), { cache: "no-store" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (j) {
            if (!j || !j.v) return;
            if (v0 === null) { v0 = j.v; return; }
            if (j.v === v0 || !mayReload) return;
            var scr = window.state && state.screen;
            if (scr && BUSY.test(scr)) return;
            location.reload();
          })
          .catch(function () {});
      }
      check(false);
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") check(true);
      });
      window.addEventListener("pageshow", function (e) { if (e.persisted) check(true); });
    })();
  </script>
</body>
</html>
