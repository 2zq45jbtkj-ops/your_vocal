    /* Заставка должна нарисоваться первой — до шрифтов и скрипта Telegram */
    html,body{background:#2f3f52}
/* Заставка при открытии: анимация логотипа СЕПТ (камертон) из оригинального
   видео + плашка «СЕПТ · ДЗ» + полоса загрузки. Фон — тёмная версия градиента
   иконки «ДЗ». Логика — splash.js. */
#splash{position:fixed;inset:0;z-index:100000;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  background:
    linear-gradient(180deg,#2f3f52 0,rgba(47,63,82,.85) calc(env(safe-area-inset-top,0px) + 10px),rgba(47,63,82,0) calc(env(safe-area-inset-top,0px) + 140px)),
    radial-gradient(90% 70% at 100% 100%, rgba(150,78,48,.85) 0%, rgba(150,78,48,0) 70%),
    radial-gradient(80% 60% at 0% 0%, rgba(92,118,142,.55) 0%, rgba(92,118,142,0) 70%),
    linear-gradient(135deg,#2c3d50 0%,#232d3b 50%,#3a2c2c 100%);
  transition:opacity .45s ease;-webkit-user-select:none;user-select:none}
#splash.sp-out{opacity:0;pointer-events:none}
#splash .sp-logo{position:absolute;left:50%;top:26vh;transform:translateX(-50%);width:min(81.5vw,440px);aspect-ratio:880/392}
#splash canvas{width:100%;height:100%;display:block}
#splash video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#splash .sp-pill{position:absolute;left:50%;top:calc(26vh + min(81.5vw,440px)*392/880 + 3vh);
  display:flex;align-items:center;gap:12px;padding:7px 22px 7px 7px;border-radius:999px;background:rgba(243,242,235,.96);
  opacity:0;transform:translateX(-50%) scale(.6);white-space:nowrap}
#splash .sp-pill img{width:44px;height:44px;border-radius:50%;display:block}
#splash .sp-pill b{display:block;font-size:17px;line-height:1.25;color:#1f2a37;font-weight:700;letter-spacing:.01em}
#splash .sp-pill span{display:block;font-size:14px;line-height:1.25;color:#AE5F3F;margin-top:1px}
#splash .sp-pill.on{animation:spPill .55s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes spPill{0%{opacity:0;transform:translateX(-50%) scale(.6)}60%{opacity:1}100%{opacity:1;transform:translateX(-50%) scale(1)}}
#splash .sp-bar{position:absolute;left:50%;transform:translateX(-50%);top:calc(26vh + min(81.5vw,440px)*392/880 + 3vh + 58px + 7vh);
  width:min(42vw,190px);height:5px;border-radius:3px;background:rgba(243,242,235,.22);overflow:hidden;opacity:0;transition:opacity .4s}
#splash .sp-bar.on{opacity:1}
#splash .sp-bar i{display:block;height:100%;width:0;border-radius:3px;background:#F3F2EB}
  </style>

  <script>
    /* Личная ссылка ?k=… — значок «ДЗ» на экране телефона открывает её же,
       чтобы приложение сразу знало, чьё это ДЗ. */
    (function () {
      var m = /[?&]k=([0-9a-fA-F-]{36})(?:&|$)/.exec(location.search);
      if (m) document.getElementById("app-manifest").href = "/api/manifest?k=" + m[1].toLowerCase();
    })();
  </script>

  <script>
    /* Новая версия без ручного перезапуска: значок на экране телефона держит
       страницу в памяти, поэтому при возвращении в приложение сверяем версию
       (api/version.js) и перезагружаемся, если вышла новая. Не трогаем экраны,
       где что-то записывается или печатается. */
    (function () {
      var v0 = null, BUSY = /^(bylo|admin-karaoke-edit|pitch-sing|support|feedback|quiz|cab-voice|token-entry|admin-karaoke-songs)$/;
      function check(mayReload) {
        fetch("/api/version?t=" + Date.now(), { cache: "no-store" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (j) {
            if (!j || !j.v) return;
            if (v0 === null) { v0 = j.v; return; }
            if (j.v === v0 || !mayReload) return;
            var scr = window.state && state.screen;
            if (scr && BUSY.test(scr)) return;
            location.reload();
          })
          .catch(function () {});
      }
      check(false);
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") check(true);
      });
      window.addEventListener("pageshow", function (e) { if (e.persisted) check(true); });
    })();
  </script>
